[package]
name = "camera-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
pipewire = "0.9.2"
prost = "0.14"
prost-types = "0.14"
redis = { version = "1.2.0", features = ["tokio-comp"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14.5"

[[bin]]
name = 'notifications'
path = 'src/notifications/main.rs'

[[bin]]
name = 'api'
path = 'src/api/main.rs'

minimum_prek_version = "0.5.7"
default_stages = ["pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty"
name = "ty check"
language = "system"
entry = "uv run --package perception-service --locked ty check"
pass_filenames = false
files = { glob = ["**/*.py", "**/*.pyi", "pyproject.toml"] }

[[repos.hooks]]
id = "perception-proto-generated"
name = "perception protobuf bindings are current"
language = "system"
entry = "./scripts/generate_proto.sh --check"
pass_filenames = false
stages = ["pre-push"]
files = { glob = [
    "proto/**/*.proto",
    "../messaging/proto/**/*.proto",
    "src/perception_service/_proto/messaging/v1/messaging_pb2.py",
    "src/perception_service/_proto/messaging/v1/messaging_pb2.pyi",
    "src/perception_service/_proto/perception/v1/perception_pb2.py",
    "src/perception_service/_proto/perception/v1/perception_pb2.pyi",
    "src/perception_service/_proto/perception/v1/perception_pb2_grpc.py",
] }

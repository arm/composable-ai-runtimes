syntax = "proto3";

package cairn.messaging.v1;

import "google/protobuf/timestamp.proto";

message CairnEvent {
  google.protobuf.Timestamp timestamp = 1;
  string origin = 2;
  string event_type = 3;
  string topic = 4;
  bytes payload = 5;
}

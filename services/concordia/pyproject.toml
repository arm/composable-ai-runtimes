[project]
name = "concordia"
description = "Concordia inference service"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio==1.70.0",
  "protobuf==5.29.6",
  "numpy==1.26.4",
  "pillow==12.2.0",
]

[project.scripts]
concordia = "inference.main:main"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[tool.ruff]
extend-exclude = [
    "src/inference/proto/concordia_pb2*.py*",
]

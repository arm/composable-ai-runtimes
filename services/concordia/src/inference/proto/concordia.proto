syntax = "proto3";

package cairn.concordia.inference.v1;

service InferenceService {
  rpc ListBricks(ListBricksRequest) returns (ListBricksResponse);
  rpc RunBrick(RunBrickRequest) returns (RunBrickResponse);
}

message ListBricksRequest {}

message ListBricksResponse {
  repeated BrickSpec bricks = 1;
}

message TextInput {
  string text = 1;
}

message ImageInput {
  bytes image_bytes = 1;
}

message RunBrickRequest {
  BrickSpec brick = 1;
  oneof input {
    TextInput text = 2;
    ImageInput image = 3;
  }
}

message RunBrickResponse {
  oneof output {
    AudioOutput audio = 1;
    ObjDetectionOutput detections = 2;
  }
}

message BrickSpec {
  BrickType type = 1;
  string brick_variant = 2;
}

enum BrickType {
  BRICK_TYPE_UNSPECIFIED = 0;
  BRICK_TYPE_TTS = 1;
  BRICK_TYPE_OBJECT_DETECTION = 2;
}

message Detection {
  repeated float box = 1; // [x1, y1, x2, y2] normalized 0..1
  int32 class_id = 2;
  float score = 3;
  string class_name = 4;
}

message ObjDetectionOutput {
  repeated Detection detections = 1;
}


message AudioOutput {
  repeated float left_channel = 1;
  repeated float right_channel = 2;
}

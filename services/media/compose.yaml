services:
  media-service:
    build:
      context: .
    image: ${MEDIA_SERVICE_IMAGE:-media-service:latest}
    user: root
    entrypoint: ["/usr/local/bin/permissions-set-entrypoint.sh"]
    # The Media service needs access to host uevents for device hotplug handling.
    network_mode: host
    group_add:
      - video
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 95
      memlock: -1
    device_cgroup_rules:
      - "c *:* rw" # Wider Cgroup permissions for devices, to reduce compatibility issues across different host configurations.
    environment:
      XDG_RUNTIME_DIR: /run/pipewire
    volumes:
      - pipewire-runtime:/run/pipewire
      - /dev:/dev
      - /run/udev:/run/udev:ro
    x-cairn:
      format_version: "0.1"
      service_version: 0.0.2
      name: Media Service
      description: Provides camera discovery and media lifecycle notifications.
      id: cairn.media-service
      role: core
      api:
        grpc:
          port: 50051
          contracts:
            - proto/media_service.proto
      messaging:
        publishes:
          - topic: camera.events
            description: Camera connection lifecycle events.
            events:
              - event_type: cairn.camera.connected
                content_type: application/json
              - event_type: cairn.camera.disconnected
                content_type: application/json
      dependencies:
        cairn.messaging-service: required

volumes:
  pipewire-runtime:

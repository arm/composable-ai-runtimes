syntax = "proto3";

package camera.pipewire.v1;

import "google/protobuf/timestamp.proto";
import "pipewire_types.proto";

enum PipewireEventType {
  UNSPECIFIED = 0;
  CAMERA_ADDED = 1;
  CAMERA_REMOVED = 2;
  STREAM_ADDED = 3;
  STREAM_REMOVED = 4;
}

message PipewireEvent {
  PipewireEventType type = 1;
  string event = 2;
  oneof payload {
    Camera camera = 3;
    Stream stream = 4;
  }
  uint64 sequence = 5;
  string session_id = 6;
  google.protobuf.Timestamp emitted_at = 7;
}

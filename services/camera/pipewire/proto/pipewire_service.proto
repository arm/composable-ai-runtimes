syntax = "proto3";

package camera.pipewire.v1;

import "pipewire_types.proto";

service PipewireService {
  rpc list_cameras (ListRequest) returns (ListCamerasResponse);
  rpc list_streams (ListRequest) returns (ListStreamsResponse);
}

message ListRequest {}

message ListCamerasResponse {
  repeated Camera cameras = 1;
}

message ListStreamsResponse {
  repeated Stream streams = 1;
}

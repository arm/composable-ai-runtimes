[package]
name = "camera"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

# Match the target compiled by the service Dockerfile.
[package.metadata.cairn.rust-notices]
target = "aarch64-unknown-linux-gnu"

[features]
smoke-test-failure-injection = []

[dependencies]
pipewire = { version = "0.9.2", features = ["v0_3_41"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
redis = { version = "1.2.0", features = ["tokio-comp"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tonic-prost-build = "0.14.5"

[dev-dependencies]
tokio = { version = "1", features = ["net", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
testcontainers = "0.27.3"

[[bin]]
name = 'notifications'
path = 'src/notifications/main.rs'

[[bin]]
name = 'api'
path = 'src/api/main.rs'

[[bin]]
name = 'generate-messaging-proto'
path = 'src/bin/generate_messaging_proto.rs'

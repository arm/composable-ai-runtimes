services:
  camera-service:
    build: 
      context: .
      args:
        PIPEWIRE_COMMIT: d20a1523b6770dfa93a270bdda5d7c800d7ec191 # 1.4.2 Release
    image: camera-service:latest
    group_add:
      - video
    cap_add:
      - SYS_NICE
    device_cgroup_rules:
      - "c *:* rwm" # Wider Cgroup permissions for devices, to reduce compatibility issues across different host configurations.
    environment:
      XDG_RUNTIME_DIR: /run/pipewire
    volumes:
      - pipewire-runtime:/run/pipewire
      - /dev:/dev
      - /run/udev:/run/udev:ro
volumes:
  pipewire-runtime:

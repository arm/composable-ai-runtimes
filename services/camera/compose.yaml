services:
  camera-service:
    build:
      context: .
    image: camera-service:latest
    user: root
    entrypoint: ["/usr/local/bin/permissions-set-entrypint.sh"]
    # The Camera service needs access to host uevents for device hotplug handling.
    network_mode: host
    group_add:
      - video
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 95
      memlock: -1
    device_cgroup_rules:
      - "c *:* rw" # Wider Cgroup permissions for devices, to reduce compatibility issues across different host configurations.
    environment:
      XDG_RUNTIME_DIR: /run/pipewire
    volumes:
      - pipewire-runtime:/run/pipewire
      - /dev:/dev
      - /run/udev:/run/udev:ro

volumes:
  pipewire-runtime:

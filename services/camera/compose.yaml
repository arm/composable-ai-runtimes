services:
  camera-service:
    build: 
      context: .
    image: camera-service:latest
    # The Camera service needs access to host uevents for device hotplug handling.
    network_mode: host
    group_add:
      - video
    cap_add:
      - SYS_NICE
    device_cgroup_rules:
      - "c *:* rwm" # Wider Cgroup permissions for devices, to reduce compatibility issues across different host configurations.
    environment:
      XDG_RUNTIME_DIR: /run/pipewire
    volumes:
      - pipewire-runtime:/run/pipewire
      - /dev:/dev
      - /run/udev:/run/udev:ro
volumes:
  pipewire-runtime:

services:
  media-service:
    build:
      context: ../../services/media
      dockerfile: Dockerfile
      target: media-service-build
    platform: linux/arm64

    volumes:
      - ../..:/workspaces/cairn-sdk:cached

    # Required for ptrace-based debuggers like C++, Go, and Rust
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    command: sleep infinity

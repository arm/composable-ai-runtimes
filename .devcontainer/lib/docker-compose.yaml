services:
  lib-dev:
    image: rust:1.93.1-trixie
    network_mode: host
    depends_on:
      - camera-service
      - camera-spoof-source
    environment:
      XDG_RUNTIME_DIR: /run/pipewire
    volumes:
      - ..:/workspaces/cairn-sdk:cached
      - pipewire-runtime:/run/pipewire
    command: sleep infinity

  camera-spoof-source:
    image: debian:trixie
    restart: unless-stopped
    depends_on:
      - camera-service
    environment:
      XDG_RUNTIME_DIR: /run/pipewire
    volumes:
      - ..:/workspaces/cairn-sdk:cached
      - pipewire-runtime:/run/pipewire
    command: >
      bash -lc "apt-get update && apt-get install -y --no-install-recommends
      gstreamer1.0-tools=1.26.2-2
      gstreamer1.0-plugins-base=1.26.2-1+deb13u1
      gstreamer1.0-plugins-good=1.26.2-1
      gstreamer1.0-pipewire=1.4.2-1
      && rm -rf /var/lib/apt/lists/*
      && /bin/bash /workspaces/cairn-sdk/services/camera/scripts/dev-spoof-pipewire-camera.sh"

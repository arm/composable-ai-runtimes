x-topo:
  name: cairn
  description: >-
    Deploy the Cairn camera and messaging services for edge AI applications
    on Arm Linux targets.
  deployment_success_message: >-
    Cairn camera and messaging services deployed. Run `topo ps --target
    <target>` from this directory to inspect the deployment.

services:
  camera-service:
    extends:
      file: services/compose.yaml
      service: camera-service
    depends_on:
      - messaging-service
    platform: linux/arm64
    pull_policy: never

  messaging-service:
    extends:
      file: services/compose.yaml
      service: messaging-service
    platform: linux/arm64
    pull_policy: never

volumes:
  pipewire-runtime:

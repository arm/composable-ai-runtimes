x-topo:
  name: cairn-sdk
  description: >-
    Deploy the Cairn SDK camera and messaging services for edge AI applications
    on Arm Linux targets.
  deployment_success_message: >-
    Cairn SDK camera and messaging services deployed. Run `topo ps --target
    <target>` from this directory to inspect the deployment.

services:
  camera-service:
    extends:
      file: services/compose.yaml
      service: camera-service
    depends_on:
      - messaging-service
    platform: linux/arm64
    pull_policy: never

  messaging-service:
    extends:
      file: services/compose.yaml
      service: messaging-service
    platform: linux/arm64
    pull_policy: never

volumes:
  pipewire-runtime:

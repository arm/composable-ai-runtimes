[project]
name = "cairn-dev-tools"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
camera-smoke = ["pytest==9.1.1"]
camera-container-smoke = [
    {include-group = "camera-smoke"},
    "docker==7.1.0",
]
camera-notifications-smoke = [
    {include-group = "camera-smoke"},
    "protobuf==7.35.1",
    "redis==8.1.0",
]
compose-validation = ["PyYAML==6.0.2", "jsonschema==4.26.0"]
python-api = ["furo==2025.12.19", "sphinx==9.1.0", "sphinx-autoapi==3.8.0"]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.ruff]
target-version = "py313"

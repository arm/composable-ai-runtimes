[project]
name = "cairn-dev-tools"
version = "0.0.0"
requires-python = "==3.13.17"

[dependency-groups]
media-smoke = ["pytest==9.1.1"]
media-container-smoke = [
    {include-group = "media-smoke"},
    "docker==7.1.0",
]
media-notifications-smoke = [
    {include-group = "media-smoke"},
    "protobuf==7.35.1",
    "redis==8.1.0",
]
compose-validation = ["PyYAML==6.0.2", "jsonschema==4.26.0"]
release = [
    {include-group = "compose-validation"},
    "requests==2.33.0",
    "packaging==25.0",
    "jinja2==3.1.6",
]
proto = ["grpcio-tools==1.83.0"]
lint = ["prek==0.5.7", "ruff==0.16.0"]
python-api = ["furo==2025.12.19", "sphinx==9.1.0", "sphinx-autoapi==3.8.0"]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.uv.workspace]
members = ["lib", "services/perception"]

[tool.ruff]
target-version = "py313"

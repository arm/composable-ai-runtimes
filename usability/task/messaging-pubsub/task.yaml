id: messaging-pubsub-python-v1
summary: Create a minimal, deterministic Python messaging demo using the Cairn Python API against the local Cairn messaging service.
prompt_file: Prompt.md

success_criteria:
  file_exists: usability/workspace/messaging_pubsub_demo.py
  stdout_exact: "received: hello-cairn-ai-usability"
  exit_code: 0

setup:
  - name: start messaging service
    run: docker compose -f services/compose.yaml up -d messaging-service

verification:
  command: PYTHONPATH=lib/python uv run --with redis==5.2.1 python usability/workspace/messaging_pubsub_demo.py
  timeout_seconds: 15

artifacts:
  - usability/workspace/messaging_pubsub_demo.py

metrics:
  capture:
    - prompt_tokens
    - completion_tokens
    - total_tokens
    - files_used
    - commands_run
    - writes_made
    - duration_seconds

notes:
  - This is intentionally scoped to a single deterministic happy-path task.
  - Prefer repo-local service startup over external hosted dependencies.

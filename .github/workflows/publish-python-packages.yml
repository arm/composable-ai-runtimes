name: Publish Python Packages to PyPI

on:
  push:
    tags:
      - "python/v*"

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate arm-cairn wheel
    if: vars.INTERNAL_REPO == 'false'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Python release tags must point to a commit on main."
            exit 1
          fi

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpipewire-0.3-dev libclang-dev patchelf

      - name: Configure release Rust version
        run: |
          source .github/scripts/rust-notices/toolchain.env
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rust-docs

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"

      - name: Install Python
        run: uv python install

      - name: Generate Rust notices
        run: |
          source .github/scripts/rust-notices/toolchain.env
          cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli
          notice_args="$(uv run --no-project python .github/scripts/rust-notices/review.py lib/pyproject.toml --cargo-args)"
          mapfile -t notice_args <<< "$notice_args"
          bash .github/scripts/rust-notices/generate.sh lib/notices/rust "${notice_args[@]}"

      - name: Build PyPI-compatible wheel with embedded CycloneDX SBOM
        working-directory: lib
        run: >-
          uv build --wheel --out-dir ../dist
          --config-setting="maturin.build-args=--compatibility pypi --auditwheel check"

      - name: Validate Python wheel metadata, license, and SBOM disclaimer
        run: |
          uv run --no-project python .github/scripts/rust-notices/review.py lib/pyproject.toml --check
          for wheel in dist/*.whl; do
            echo "Validating license in $wheel"
            unzip -p "$wheel" '*/METADATA' | grep -Fx 'License-Expression: Apache-2.0'
            unzip -p "$wheel" '*.dist-info/licenses/LICENSE' | cmp LICENSE -
            unzip -p "$wheel" '*.dist-info/licenses/THIRD-PARTY-DISCLAIMER.txt' \
              | cmp THIRD-PARTY-DISCLAIMER.txt -
            unzip -p "$wheel" '*.dist-info/licenses/crates/cairn/SBOM-DISCLAIMER.txt' \
              | cmp lib/crates/cairn/SBOM-DISCLAIMER.txt -
            extracted="$(mktemp -d)"
            unzip -q "$wheel" '*.dist-info/licenses/notices/rust/*' -d "$extracted"
            diff --recursive lib/notices/rust "$extracted"/*.dist-info/licenses/notices/rust
          done

      - name: Upload validated wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-dist
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish arm-cairn to PyPI
    needs: build
    if: vars.INTERNAL_REPO == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download validated wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-release-dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: false

      - name: Validate distribution metadata
        run: uv run --no-project --isolated --python 3.12 --with twine==7.0.0 python -m twine check dist/*.whl

      - name: Generate PyPI publish attestations
        run: >-
          uv run --no-project --isolated --python 3.12 --with pypi-attestations==0.0.30
          python -m pypi_attestations sign dist/*.whl

      - name: Publish Python package to PyPI
        run: uv publish --trusted-publishing always dist/*.whl dist/*.whl.publish.attestation

  publish-docs:
    name: Publish Python API reference to production
    needs: publish
    if: vars.INTERNAL_REPO == 'false'
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHON_VERSION: "3.12"
    concurrency:
      group: publish-python-api-reference-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate publishing configuration
        env:
          AWS_ROLE_ARN: ${{ vars.CAIRN_DOCS_AWS_ROLE_ARN }}
          SITE_ID: ${{ vars.CAIRN_PYTHON_API_SITE_ID }}
        run: |
          if [[ -z "${AWS_ROLE_ARN}" || -z "${SITE_ID}" ]]; then
            echo "::error::The production environment must define CAIRN_DOCS_AWS_ROLE_ARN and CAIRN_PYTHON_API_SITE_ID."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Build API reference
        run: >-
          uv run --no-project --python "$PYTHON_VERSION"
          --with furo==2025.12.19
          --with sphinx==9.1.0
          --with sphinx-autoapi==3.8.0
          python -m sphinx -W --keep-going -b html
          docs/python-api
          docs/python-api/_build/html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.CAIRN_DOCS_AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Upload API reference
        uses: ARM-Software/docs-action/upload@3c7568b8ae13d83b9a0b4b4112ae1f367eed5ff6
        with:
          source-dir: docs/python-api/_build/html
          site-id: ${{ vars.CAIRN_PYTHON_API_SITE_ID }}
          environment: production

name: Camera Contract Tests

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    if: vars.INTERNAL_REPO == 'true'
    uses: ./.github/workflows/ci-detect-changes.yml
    permissions:
      contents: read
    with:
      paths: |
        services/camera/src/api/**
        services/camera/src/notifications/**
        services/camera/src/camera.rs
        services/camera/src/helpers.rs
        services/camera/src/lib.rs
        services/camera/src/logging.rs
        services/camera/proto/**
        services/camera/Cargo.toml
        services/camera/Cargo.lock
        services/camera/build.rs
        .github/workflows/camera-contract-test.yml
        .github/workflows/ci-detect-changes.yml
        .github/workflows/ci-evaluate-results.yml

  camera-contract:
    needs: changes
    if: vars.INTERNAL_REPO == 'true' && needs.changes.outputs.changed == 'true'
    name: Run camera contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpipewire-0.3-dev pkg-config

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Run camera API contract test
        run: cargo test --lib api::contract_tests
        working-directory: services/camera

      - name: Run camera notification contract test
        run: cargo test --bin notifications redis_contract_test
        working-directory: services/camera

  required:
    name: CI / Camera Contract Tests
    if: always() && vars.INTERNAL_REPO == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [changes, camera-contract]
    uses: ./.github/workflows/ci-evaluate-results.yml
    with:
      results: ${{ toJSON(needs) }}

name: Publish Rust Crates to crates.io

on:
  push:
    tags:
      - "rust/v*"
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full commit SHA on public main containing the committed SBOM'
        required: true
        type: string
      package_version:
        description: 'Expected arm-cairn version to recover (for example 0.0.2)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.package_version && format('rust/v{0}', inputs.package_version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish Cairn Rust crates
    if: >-
      vars.INTERNAL_REPO == 'false' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    environment: crates-io
    permissions:
      contents: read

    steps:
      - name: Validate recovery inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Recovery requires a full commit SHA and an X.Y.Z package version."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.ref }}

      - name: Require a newer Rust version
        if: github.event_name == 'push'
        uses: ./.github/actions/check-version-tag
        with:
          tag-prefix: rust/v

      - name: Verify release commit is on main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$SOURCE_SHA" && "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout does not match the requested recovery commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Rust publication requires a commit on main."
            exit 1
          fi

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.99.1"

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --version 0.10.0 --locked

      - name: Check committed Rust SBOM
        run: .github/scripts/sbom/generate-rust.sh --check

      - name: Package and publish Rust crates
        working-directory: lib
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          UMBRELLA_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          crates=(arm-cairn-camera arm-cairn-notification arm-cairn-perception arm-cairn)
          if [[ "$UMBRELLA_ONLY" == true ]]; then
            crates=(arm-cairn)
          fi
          expected_version="${PACKAGE_VERSION:-${GITHUB_REF_NAME#rust/v}}"
          for crate in "${crates[@]}"; do
            crate_version=$(cargo metadata --format-version 1 --no-deps | jq -er --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if [[ "$crate_version" != "$expected_version" ]]; then
              echo "::error::$crate version $crate_version does not match expected $expected_version."
              exit 1
            fi
            cargo package -p "${crate}"
            crate_filename="${crate}-${crate_version}.crate"
            crate_path="target/package/${crate_filename}"
            echo "Validating license in ${crate_path}"
            tar -xOf "$crate_path" "${crate}-${crate_version}/Cargo.toml" | grep -Fx 'license = "Apache-2.0"'
            tar -xOf "$crate_path" "${crate}-${crate_version}/LICENSE" | cmp ../LICENSE -
            tar -xOf "$crate_path" "${crate}-${crate_version}/THIRD-PARTY-DISCLAIMER.txt" \
              | cmp ../THIRD-PARTY-DISCLAIMER.txt -
            if [[ "${crate}" == "arm-cairn" ]]; then
              tar -xOf "$crate_path" "${crate}-${crate_version}/SBOM-DISCLAIMER.txt" \
                | cmp crates/cairn/SBOM-DISCLAIMER.txt -
              tar -xOf "$crate_path" "${crate}-${crate_version}/bom.json" \
                | cmp crates/cairn/bom.json -
            fi
            cargo publish -p "${crate}"
          done

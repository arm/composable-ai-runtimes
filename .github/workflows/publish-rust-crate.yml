name: Publish Rust Crates to crates.io

on:
  push:
    tags:
      - "rust/v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Package and publish Cairn Rust crates
    if: vars.INTERNAL_REPO == 'false'
    runs-on: ubuntu-24.04-arm
    environment: crates-io
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a newer Rust version
        uses: ./.github/actions/check-version-tag
        with:
          tag-prefix: rust/v

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Rust release tags must point to a commit on main."
            exit 1
          fi

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.99.1"

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --version 0.10.0 --locked

      - name: Generate Cargo CycloneDX SBOM
        working-directory: lib
        env:
          SBOM_PATH: crates/cairn/bom.json
        run: |
          cargo sbom \
            --cargo-package arm-cairn \
            --project-directory . \
            --output-format cyclone_dx_json_1_6 \
            > "${SBOM_PATH}"

      - name: Package and publish Rust crates
        working-directory: lib
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          for crate in arm-cairn-camera arm-cairn-notification arm-cairn-perception arm-cairn; do
            cargo package -p "${crate}"
            crate_version=$(cargo metadata --format-version 1 --no-deps | jq -er --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            crate_filename="${crate}-${crate_version}.crate"
            crate_path="target/package/${crate_filename}"
            echo "Validating license in ${crate_path}"
            tar -xOf "$crate_path" "${crate}-${crate_version}/Cargo.toml" | grep -Fx 'license = "Apache-2.0"'
            tar -xOf "$crate_path" "${crate}-${crate_version}/LICENSE" | cmp ../LICENSE -
            tar -xOf "$crate_path" "${crate}-${crate_version}/THIRD-PARTY-DISCLAIMER.txt" \
              | cmp ../THIRD-PARTY-DISCLAIMER.txt -
            if [[ "${crate}" == "arm-cairn" ]]; then
              tar -xOf "$crate_path" "${crate}-${crate_version}/SBOM-DISCLAIMER.txt" \
                | cmp crates/cairn/SBOM-DISCLAIMER.txt -
            fi
            cargo publish -p "${crate}"
          done

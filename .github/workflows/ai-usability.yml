name: AI Usability

on:
  workflow_dispatch:
  push:
    branches:
      - ai-usability
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  framework:
    runs-on: self-hosted-ubuntu-24.04-arm64-ephemeral
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Arm internal CA certificates
        run: |
          set -euo pipefail
          sudo curl -L -o /usr/local/share/ca-certificates/arm-enterprise-root.crt \
            "https://artifactory.arm.com/artifactory/vault.pki/ent-pki/pem/certs/ARM%20Enterprise%20PKI%20Root%20CA.pem"
          sudo update-ca-certificates

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"

      - name: Run usability framework
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          uv run --with pyyaml==6.0.2 --with requests==2.32.3 \
            python usability/run_framework.py \
            --results-dir usability/results \
            --history usability/history/history.json

      - name: Clean up messaging service
        if: always()
        run: docker compose -f services/compose.yaml down --volumes --remove-orphans

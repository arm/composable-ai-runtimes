name: publish-sdk-bundle

on:
  push:
    tags:
      - 'cairn/v*'

permissions:
  contents: read

concurrency:
  group: publish-release-bundle-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PACKAGE_URL: https://crates.io/crates/arm-cairn/{version}
  PYPI_PACKAGE_URL: https://pypi.org/project/arm-cairn/{version}/
  REGISTRY_NAMESPACE: armlimited

jobs:
  validate-bundle-config:
    name: Validate bundle config
    if: vars.INTERNAL_REPO == 'false'
    runs-on: ubuntu-24.04-arm
    outputs:
      service-images: ${{ steps.service-images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a newer bundle version
        uses: ./.github/actions/check-version-tag
        with:
          tag-prefix: cairn/v
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"
      - name: Install CI dependencies
        run: uv sync --project lib --only-group ci --locked
      - name: Install ORAS
        run: |
          curl -fsSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_arm64.tar.gz
          tar -xzf oras.tar.gz oras
          sudo install -m 0755 oras /usr/local/bin/oras
          oras version
      - name: Validate published component versions
        run: >-
          uv run --project lib --no-sync .github/scripts/bundle-registry-check.py
          .github/workflows/release-config/bundle-config.yaml
          --tag "$GITHUB_REF_NAME"
          --registry-namespace "$REGISTRY_NAMESPACE"
          --service-images-output "$RUNNER_TEMP/service-images.json"
      - name: Export verified service images
        id: service-images
        run: echo "images=$(cat "$RUNNER_TEMP/service-images.json")" >> "$GITHUB_OUTPUT"

  generate-release-notes:
    name: Generate release notes
    if: vars.INTERNAL_REPO == 'false'
    needs: validate-bundle-config
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"
      - name: Install CI dependencies
        run: uv sync --project lib --only-group ci --locked
      - name: Generate release notes
        env:
          SERVICE_IMAGES: ${{ needs.validate-bundle-config.outputs.service-images }}
        run: >-
          uv run --project lib --no-sync .github/scripts/bundle-release-notes.py
          .github/workflows/release-config/bundle-config.yaml
          --output "$RUNNER_TEMP/bundle-notes.md"
          --cargo-package-url "$CARGO_PACKAGE_URL"
          --pypi-package-url "$PYPI_PACKAGE_URL"
          --registry-namespace "$REGISTRY_NAMESPACE"
          --service-images "$SERVICE_IMAGES"
      - name: Install GH CLI
        run: |
            sudo apt-get update
            sudo apt-get install -y gh
      - name: Create the bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" .github/workflows/release-config/bundle-config.yaml \
            --verify-tag --draft \
            --title "Cairn ${GITHUB_REF_NAME#cairn/v}" \
            --notes-file "$RUNNER_TEMP/bundle-notes.md"

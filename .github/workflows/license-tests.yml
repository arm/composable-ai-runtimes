name: License tooling tests

on:
  merge_group:
    types: [checks_requested]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-detect-changes.yml
    with:
      paths: |
        .python-version
        .github/workflows/license-tests.yml
        .github/workflows/publish-python-packages.yml
        .github/workflows/publish-rust-crate.yml
        lib/crates/*/bom.json
        lib/crates/*/SBOM-DISCLAIMER.txt
        .github/workflows/publish-service-images.yml
        .github/scripts/sbom/**
        .github/scripts/container-notices/**
        .github/scripts/probe-notices/**
        .github/scripts/rust-notices/**
        .github/scripts/check_license_headers.py
        services/*/scripts/source_links.py
        services/camera/Dockerfile
        services/perception/Dockerfile
        lib/Cargo.toml
        lib/Cargo.lock
        lib/crates/*/Cargo.toml
        lib/pyproject.toml
        lib/.cargo/config.toml
        lib/rust-toolchain.toml
        services/*/Cargo.toml
        services/*/Cargo.lock
        services/*/.cargo/config*
        **/LICENSE*
        **/LICENSES/**
        **/COPYING*
        **/COPYRIGHT*
        **/NOTICE*
        **/THIRD-PARTY-DISCLAIMER.txt
        **/licenses/**
        **/notices/**
        **/about.toml
        .github/workflows/ci-detect-changes.yml
        .github/workflows/ci-evaluate-results.yml

  source-report:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Dependency source report format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"

      - name: Check PipeWire inventory against committed build pins
        run: python .github/scripts/sbom/check_pipewire.py services/camera services/perception

      - name: Test source report format
        run: |
          uv pip install pytest==9.1.1
          python -m pytest .github/scripts/sbom/test_source_links.py -q

  rust-review:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Rust license review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"

      - name: Review Python wheel Rust dependencies
        run: python .github/scripts/rust-notices/review.py lib/pyproject.toml

      - name: Review service Rust dependencies
        shell: bash
        run: |
          status=0
          for manifest in services/*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            python .github/scripts/rust-notices/review.py "$manifest" || status=1
          done
          exit "$status"

  rust-sbom:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Rust SBOMs are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.99.1"
      - name: Install cargo-sbom
        run: cargo install cargo-sbom --version 0.10.0 --locked
      - name: Check committed Rust SBOMs
        run: .github/scripts/sbom/generate-rust.sh --check

  required:
    name: CI / License tooling tests
    if: always()
    needs: [changes, source-report, rust-review, rust-sbom]
    uses: ./.github/workflows/ci-evaluate-results.yml
    with:
      results: ${{ toJSON(needs) }}

name: Python Perception SDK E2E

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  perception-e2e:
    if: vars.INTERNAL_REPO == 'true'
    name: Run Python Perception SDK E2E
    runs-on: self-hosted-ubuntu-24.04-arm64-ephemeral
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"
          enable-cache: true

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Run Python Perception SDK E2E
        run: uv run --locked python -m pytest -c pyproject.toml -m e2e tests/test_e2e_perception_workflow.py

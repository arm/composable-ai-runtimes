name: Python Perception SDK E2E

on:
  # Emit a skipped PR check so queue-only E2E can be required without blocking queue entry.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  perception-e2e:
    if: vars.INTERNAL_REPO == 'true' && github.event_name == 'merge_group'
    name: Run Python Perception SDK E2E
    runs-on: self-hosted-ubuntu-24.04-arm64-ephemeral
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          checksum: "1ae72b4718729e2ccc4f1ae2c6d1e531ca8467800e0546e9130b3886023a60ab"
          enable-cache: true

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Run Python Perception SDK E2E
        run: uv run --locked python -m pytest -c pyproject.toml -m e2e tests/test_e2e_perception_workflow.py

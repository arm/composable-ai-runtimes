name: Python Perception SDK E2E

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    if: vars.INTERNAL_REPO == 'true'
    uses: ./.github/workflows/ci-detect-changes.yml
    permissions:
      contents: read
    with:
      paths: |
        .github/workflows/perception-e2e-tests.yml
        services/perception/**
        services/messaging/**
        lib/**
        .github/workflows/ci-detect-changes.yml
        .github/workflows/ci-evaluate-results.yml

  perception-e2e:
    needs: changes
    if: vars.INTERNAL_REPO == 'true' && needs.changes.outputs.changed == 'true'
    name: Run Python Perception SDK E2E
    runs-on: self-hosted-ubuntu-24.04-arm64-ephemeral
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Log in to Docker Hub
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Run Python Perception SDK E2E
        run: uv run --locked python -m pytest -c pyproject.toml -m e2e tests/test_e2e_perception_workflow.py

  required:
    name: CI / Python Perception SDK E2E
    if: always() && vars.INTERNAL_REPO == 'true' && github.event_name == 'pull_request'
    needs: [changes, perception-e2e]
    uses: ./.github/workflows/ci-evaluate-results.yml
    with:
      results: ${{ toJSON(needs) }}

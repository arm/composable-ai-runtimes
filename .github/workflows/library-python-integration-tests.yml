name: Python Bindings Integration Tests

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    if: vars.INTERNAL_REPO == 'true'
    uses: ./.github/workflows/ci-detect-changes.yml
    permissions:
      contents: read
    with:
      paths: |
        .github/workflows/library-python-integration-tests.yml
        services/perception/**
        lib/**
        .github/workflows/ci-detect-changes.yml
        .github/workflows/ci-evaluate-results.yml

  python-bindings:
    needs: changes
    if: vars.INTERNAL_REPO == 'true' && needs.changes.outputs.changed == 'true'
    name: Run Python bindings integration tests
    runs-on: self-hosted-ubuntu-24.04-arm64-ephemeral
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler redis-server
          sudo systemctl stop redis-server

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"
          enable-cache: true

      - name: Run Python bindings integration tests
        run: uv run python -m pytest -m "not e2e" tests

  required:
    name: CI / Python Bindings Integration Tests
    if: always() && vars.INTERNAL_REPO == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [changes, python-bindings]
    uses: ./.github/workflows/ci-evaluate-results.yml
    with:
      results: ${{ toJSON(needs) }}

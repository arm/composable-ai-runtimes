name: Publish Documentation to Staging

on:
  push:
    branches:
      - "**"
    paths:
      - docs-website/**
      - .github/workflows/publish-docs-s3.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Configure Git with secret
        run: |
          git config --global url."https://${{ secrets.GIT_SECRET }}:x-oauth-basic@github.com/Arm-Debug".insteadOf "https://github.com/Arm-Debug"
        env:
          GIT_SECRET: ${{ secrets.GIT_SECRET }}

      - name: AWS GitHub OIDC Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::529607359382:role/Proj-GHA-cairn-sdk-s3-upload
          aws-region: eu-west-1

      - name: Publish docs
        uses: Arm-Debug/arm-docs-github-action/actions/publish@v0.4.1
        with:
          docs-root: docs-website
          site-id: cairn-sdk
          github-token: ${{ secrets.GIT_SECRET }}
          aws-region: eu-west-1
          site-url: https://docs.staging.devplatform.arm.com
          s3-bucket: arm-edge-ai-docs-staging-529607359382
          cloudfront-distribution-id: E3668SHWG5R3NX
          cloudfront-invalidate: true

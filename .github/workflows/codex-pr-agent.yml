name: Codex PR Agent

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review or ask about.
        required: true
        type: number
      command:
        description: Codex command to run for the PR.
        required: true
        default: "@cairn-codex review"
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  codex-pr-agent:
    name: Run Codex PR agent
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '@cairn-codex') &&
          contains(
            fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
            github.event.comment.author_association
          )
        )
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: codex-pr-agent-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      CODEX_AGENT_ALIAS: "@cairn-codex"
      CODEX_PROMPT_PATH: ${{ runner.temp }}/codex-pr-agent-prompt.md
      PR_NUMBER: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.pr_number ||
          github.event.issue.number
        }}
    steps:
      - name: Checkout workflow utilities
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build Codex prompt
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          WORKFLOW_COMMAND: ${{ inputs.command }}
        run: |
          args=(
            --prompt-template .github/codex/prompts/pr-agent.md
            --output "${CODEX_PROMPT_PATH}"
          )
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            args+=(
              --pr-number "${PR_NUMBER}"
              --comment-body "${WORKFLOW_COMMAND}"
              --comment-author "${GITHUB_ACTOR}"
              --author-association OWNER
            )
          fi
          python3 .github/scripts/codex-pr-context.py "${args[@]}"

      - name: Checkout pull request merge ref
        if: steps.context.outputs.should_run == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Copy generated prompt into workspace
        if: steps.context.outputs.should_run == 'true'
        run: cp "${CODEX_PROMPT_PATH}" codex-pr-agent-prompt.md

      - name: Run Codex
        if: steps.context.outputs.should_run == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-pr-agent-prompt.md
          sandbox: read-only
          safety-strategy: drop-sudo
          output-file: codex-output.md

      - name: Post Codex response
        if: >-
          steps.context.outputs.should_run == 'true' &&
          steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- cairn-codex-pr-agent -->';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `${marker}\n${process.env.CODEX_FINAL_MESSAGE}`,
            });

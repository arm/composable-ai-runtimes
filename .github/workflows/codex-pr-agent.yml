name: Codex PR Agent

on:
  push:
    branches:
      - feat/codex-pr-workflow
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review or ask about.
        required: true
        type: number
      command:
        description: Codex command to run for the given PR.
        required: true
        default: "@cairn-codex review"
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  codex-pr-agent:
    name: Run Codex PR agent
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '@cairn-codex') &&
          contains(
            fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
            github.event.comment.author_association
          )
        )
      }}
    runs-on: self-hosted-ubuntu-24.04-arm64-ephemeral
    concurrency:
      group: >-
        codex-pr-agent-${{
          github.event_name == 'workflow_dispatch' &&
          inputs.pr_number ||
          github.event.issue.number ||
          github.ref_name
        }}
      cancel-in-progress: true
    env:
      CODEX_AGENT_ALIAS: "@cairn-codex"
      CODEX_PROMPT_PATH: /tmp/codex-pr-agent-prompt.md
      PR_NUMBER: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.pr_number ||
          github.event.issue.number ||
          ''
        }}
    steps:
      - name: Checkout workflow utilities
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build Codex prompt
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          WORKFLOW_COMMAND: ${{ inputs.command }}
        run: |
          args=(
            --prompt-template .github/codex/prompts/pr-agent.md
            --output "${CODEX_PROMPT_PATH}"
          )
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            args+=(
              --pr-number "${PR_NUMBER}"
              --comment-body "${WORKFLOW_COMMAND}"
              --comment-author "${GITHUB_ACTOR}"
              --author-association OWNER
            )
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            args+=(
              --head-ref "${GITHUB_REF_NAME}"
              --comment-body "@cairn-codex review"
              --comment-author "${GITHUB_ACTOR}"
              --author-association OWNER
            )
          fi
          python3 .github/scripts/codex-pr-context.py "${args[@]}"

      - name: Checkout pull request merge ref
        if: steps.context.outputs.should_run == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ steps.context.outputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Copy generated prompt into workspace
        if: steps.context.outputs.should_run == 'true'
        run: cp "${CODEX_PROMPT_PATH}" codex-pr-agent-prompt.md

      - name: Install Codex CLI
        if: steps.context.outputs.should_run == 'true'
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          set -euo pipefail
          mkdir -p "${NPM_CONFIG_PREFIX}/bin"
          echo "${NPM_CONFIG_PREFIX}/bin" >> "${GITHUB_PATH}"
          npm install -g "@openai/codex@latest"
          "${NPM_CONFIG_PREFIX}/bin/codex" --version

      - name: Configure Codex for Arm OpenAI proxy
        if: steps.context.outputs.should_run == 'true'
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          if [ -z "${OPENAI_BASE_URL}" ]; then
            echo "OPENAI_BASE_URL secret is required for the Arm OpenAI proxy." >&2
            exit 1
          fi
          mkdir -p "${HOME}/.codex"
          cat > "${HOME}/.codex/ci.config.toml" <<'EOF'
          model = "gpt-5-codex"
          model_provider = "arm_proxy"
          model_reasoning_effort = "medium"

          [model_providers.arm_proxy]
          name = "arm_proxy"
          base_url = "__OPENAI_BASE_URL__"
          env_key = "OPENAI_API_KEY"
          wire_api = "responses"
          EOF
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path.home() / ".codex" / "ci.config.toml"
          path.write_text(
              path.read_text(encoding="utf-8").replace(
                  "__OPENAI_BASE_URL__", os.environ["OPENAI_BASE_URL"]
              ),
              encoding="utf-8",
          )
          PY

      - name: Run Codex
        if: steps.context.outputs.should_run == 'true'
        id: run_codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec \
            --profile ci \
            --sandbox read-only \
            --ephemeral \
            --output-last-message codex-output.md \
            - < codex-pr-agent-prompt.md

          {
            echo "final-message<<__CODEX_FINAL_MESSAGE__"
            cat codex-output.md
            echo "__CODEX_FINAL_MESSAGE__"
          } >> "${GITHUB_OUTPUT}"

      - name: Post Codex response
        if: >-
          steps.context.outputs.should_run == 'true' &&
          steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- cairn-codex-pr-agent -->';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `${marker}\n${process.env.CODEX_FINAL_MESSAGE}`,
            });

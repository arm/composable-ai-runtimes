name: Codex PR Agent

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  codex-pr-agent:
    name: Run Codex PR agent
    if: >-
      ${{
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@cairn-codex') &&
        contains(
          fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association
        )
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: codex-pr-agent-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      CODEX_AGENT_ALIAS: "@cairn-codex"
      CODEX_PROMPT_PATH: ${{ runner.temp }}/codex-pr-agent-prompt.md
    steps:
      - name: Checkout workflow utilities
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build Codex prompt
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
        run: |
          python3 .github/scripts/codex-pr-context.py \
            --prompt-template .github/codex/prompts/pr-agent.md \
            --output "${CODEX_PROMPT_PATH}"

      - name: Checkout pull request merge ref
        if: steps.context.outputs.should_run == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Copy generated prompt into workspace
        if: steps.context.outputs.should_run == 'true'
        run: cp "${CODEX_PROMPT_PATH}" codex-pr-agent-prompt.md

      - name: Run Codex
        if: steps.context.outputs.should_run == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-pr-agent-prompt.md
          sandbox: read-only
          safety-strategy: drop-sudo
          output-file: codex-output.md

      - name: Post Codex response
        if: >-
          steps.context.outputs.should_run == 'true' &&
          steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- cairn-codex-pr-agent -->';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `${marker}\n${process.env.CODEX_FINAL_MESSAGE}`,
            });

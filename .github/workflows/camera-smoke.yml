name: Camera Smoke

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/scripts/camera-boardfarm-list-cameras-smoke.py
      - .github/scripts/camera-boardfarm-notifications-hotplug.py
      - .github/scripts/camera-boardfarm-pipewire-failure-smoke.py
      - .github/scripts/camera-boardfarm-startup-smoke.py
      - .github/scripts/camera-service-lifecycle-smoke.py
      - .github/scripts/camera-service-startup-smoke.py
      - .github/scripts/camera_smoke/**
      - .github/workflows/camera-smoke.yml
      - services/camera/**
      - services/compose.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-smoke:
    name: Validate and smoke test camera service
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate camera service Compose config
        run: docker compose -f services/camera/compose.yaml config

      - name: Validate services Compose camera wiring
        run: docker compose -f services/compose.yaml config camera-service

      - name: Build camera service Docker image
        run: docker build --progress=plain --tag camera-service:latest services/camera

      - name: Install smoke test dependencies
        run: python3 -m pip install pytest==8.3.5 docker==7.1.0

      - name: Run camera startup smoke check
        env:
          CAMERA_STARTUP_SMOKE_BUILD_IMAGE: "0"
        run: |
          mkdir -p test-results/camera-startup-smoke
          python3 -m pytest .github/scripts/camera-service-startup-smoke.py \
            --junitxml=test-results/camera-startup-smoke/junit.xml

      - name: Run camera lifecycle supervision check
        env:
          CAMERA_LIFECYCLE_BUILD_IMAGE: "0"
        run: |
          mkdir -p test-results/camera-lifecycle
          python3 -m pytest .github/scripts/camera-service-lifecycle-smoke.py \
            --junitxml=test-results/camera-lifecycle/junit.xml

      - name: Upload camera startup smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camera-startup-smoke-results
          path: test-results/camera-startup-smoke/

      - name: Upload camera lifecycle results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camera-lifecycle-results
          path: test-results/camera-lifecycle/

  boardfarm-startup-smoke:
    name: Validate camera on Pi board farm
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - boardfarm
      - pi5
    concurrency:
      group: camera-boardfarm-pi5-usb-camera
      queue: max
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: camera-boardfarm-${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"

      - name: Run camera board-farm startup smoke check
        run: |
          mkdir -p test-results/camera-boardfarm-smoke
          uv run --with pytest==8.3.5 python -m pytest .github/scripts/camera-boardfarm-startup-smoke.py \
            --junitxml=test-results/camera-boardfarm-smoke/junit.xml

      - name: Clean up camera board-farm Compose resources
        if: always()
        run: docker compose -f services/camera/compose.yaml down --volumes --remove-orphans

      - name: Upload camera board-farm startup smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camera-boardfarm-smoke-results
          path: test-results/camera-boardfarm-smoke/

  boardfarm-list-cameras-smoke:
    name: Validate camera discovery on Pi board farm
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - boardfarm
      - pi5
    concurrency:
      group: camera-boardfarm-pi5-usb-camera
      queue: max
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: camera-boardfarm-list-cameras-${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"

      - name: Install grpcurl
        run: |
          set -euo pipefail
          grpcurl_version=1.9.3
          arch="$(uname -m)"
          case "${arch}" in
            aarch64|arm64)
              grpcurl_arch=arm64
              ;;
            *)
              echo "unsupported grpcurl architecture: ${arch}" >&2
              exit 1
              ;;
          esac
          mkdir -p test-results/camera-boardfarm-list-cameras-smoke/bin
          curl -fsSL "https://github.com/fullstorydev/grpcurl/releases/download/v${grpcurl_version}/grpcurl_${grpcurl_version}_linux_${grpcurl_arch}.tar.gz" \
            | tar -xz -C test-results/camera-boardfarm-list-cameras-smoke/bin grpcurl
          test-results/camera-boardfarm-list-cameras-smoke/bin/grpcurl -version

      - name: Run camera board-farm list-cameras smoke check
        env:
          GRPCURL_BIN: test-results/camera-boardfarm-list-cameras-smoke/bin/grpcurl
        run: |
          mkdir -p test-results/camera-boardfarm-list-cameras-smoke
          uv run --with pytest==8.3.5 python -m pytest .github/scripts/camera-boardfarm-list-cameras-smoke.py \
            --junitxml=test-results/camera-boardfarm-list-cameras-smoke/junit.xml

      - name: Clean up camera board-farm list-cameras Compose resources
        if: always()
        run: docker compose -f services/camera/compose.yaml down --volumes --remove-orphans

      - name: Upload camera board-farm list-cameras smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camera-boardfarm-list-cameras-smoke-results
          path: test-results/camera-boardfarm-list-cameras-smoke/

  boardfarm-pipewire-failure-smoke:
    name: Validate camera PipeWire failure on Pi board farm
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - boardfarm
      - pi5
    concurrency:
      group: camera-boardfarm-pi5-usb-camera
      queue: max
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: camera-boardfarm-pipewire-failure-${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"

      - name: Install grpcurl
        run: |
          set -euo pipefail
          grpcurl_version=1.9.3
          arch="$(uname -m)"
          case "${arch}" in
            aarch64|arm64)
              grpcurl_arch=arm64
              ;;
            *)
              echo "unsupported grpcurl architecture: ${arch}" >&2
              exit 1
              ;;
          esac
          mkdir -p test-results/camera-boardfarm-pipewire-failure/bin
          curl -fsSL "https://github.com/fullstorydev/grpcurl/releases/download/v${grpcurl_version}/grpcurl_${grpcurl_version}_linux_${grpcurl_arch}.tar.gz" \
            | tar -xz -C test-results/camera-boardfarm-pipewire-failure/bin grpcurl
          test-results/camera-boardfarm-pipewire-failure/bin/grpcurl -version

      - name: Run camera board-farm PipeWire failure smoke check
        env:
          GRPCURL_BIN: test-results/camera-boardfarm-pipewire-failure/bin/grpcurl
        run: |
          mkdir -p test-results/camera-boardfarm-pipewire-failure
          uv run --with pytest==8.3.5 python -m pytest .github/scripts/camera-boardfarm-pipewire-failure-smoke.py \
            --junitxml=test-results/camera-boardfarm-pipewire-failure/junit.xml

      - name: Clean up camera board-farm PipeWire failure Compose resources
        if: always()
        run: docker compose -f services/camera/compose.yaml down --volumes --remove-orphans

      - name: Upload camera board-farm PipeWire failure smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: camera-boardfarm-pipewire-failure-results
          path: test-results/camera-boardfarm-pipewire-failure/

  boardfarm-notifications-hotplug:
    name: Validate camera notifications on Pi board farm
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - boardfarm
      - pi5
    concurrency:
      group: camera-boardfarm-pi5-usb-camera
      queue: max
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: camera-boardfarm-notifications-${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"

      - name: Run camera board-farm notification hotplug check
        env:
          PYTHONPATH: .github/scripts
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p test-results/camera-boardfarm-notifications
          uv run \
            --with pytest==8.3.5 \
            --with redis==5.2.1 \
            python -m pytest -p no:cacheprovider .github/scripts/camera-boardfarm-notifications-hotplug.py \
            --junitxml=test-results/camera-boardfarm-notifications/junit.xml

      - name: Clean up camera board-farm notification Compose resources
        if: always()
        run: docker compose -f services/compose.yaml down --volumes --remove-orphans

      - name: Upload camera board-farm notification hotplug results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camera-boardfarm-notifications-results
          path: test-results/camera-boardfarm-notifications/

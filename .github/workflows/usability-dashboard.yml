name: Usability Dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'usability/history/history.json'
      - 'usability/site/**'
      - '.github/workflows/usability-dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: usability-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/history
          cp usability/site/index.html _site/index.html
          cp usability/history/history.json _site/history/history.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@5b2d5b9efabf140fd9485b849f6d5d02c5b780a1 # v3.0.1
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@6e27c91d6b9c7d4ac65e58b571c8838e0dc4f201 # v4.0.5

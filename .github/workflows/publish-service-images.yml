name: Publish Service Images

on:
  push:
    tags:
      - "camera/v*"
      - "messaging/v*"
      - "perception/v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  validate-service-contracts:
    name: Validate service contracts
    if: vars.INTERNAL_REPO == 'false'
    runs-on: ubuntu-24.04-arm
    outputs:
      service: ${{ steps.component.outputs.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Service release tags must point to a commit on main."
            exit 1
          fi

      - name: Select service from release tag
        id: component
        run: echo "service=${GITHUB_REF_NAME%%/*}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"

      - name: Validate service contracts
        run: uv run --with PyYAML==6.0.2 --with jsonschema==4.25.1 python .github/scripts/cairn-contract/validate-manifests.py

  publish:
    name: Publish ${{ matrix.service }} service image
    if: vars.INTERNAL_REPO == 'false'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm
    needs: validate-service-contracts
    strategy:
      matrix:
        service:
          - ${{ needs.validate-service-contracts.outputs.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate image tag
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/armlimited/arm-cairn-${{ matrix.service }}-service
          tags: |
            type=match,pattern=${{ matrix.service }}/v(.*),group=1

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v2.40.3

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"

      - name: Install ORAS
        run: |
          curl -fsSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_arm64.tar.gz
          tar -xzf oras.tar.gz oras
          sudo install -m 0755 oras /usr/local/bin/oras
          oras version

      - name: Configure service image
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          service_repository="docker.io/armlimited/arm-cairn-${SERVICE}-service"
          release_service_image="${service_repository}:${VERSION}"
          echo "SERVICE_REPOSITORY=${service_repository}" >> "$GITHUB_ENV"
          echo "RELEASE_SERVICE_TAG=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_SERVICE_IMAGE=${release_service_image}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          registry: docker.io
          username: armlimited

      - name: Configure service version
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          service_version="$(uv run --with PyYAML==6.0.2 python .github/scripts/cairn-contract/get-service-version.py "$SERVICE")"
          service_tag_version="${service_version//+/_}"
          service_contract_tag="service-${service_tag_version}"
          echo "SERVICE_VERSION=${service_version}" >> "$GITHUB_ENV"
          echo "SERVICE_CONTRACT_TAG=${service_contract_tag}" >> "$GITHUB_ENV"

      - name: Check service version tags
        id: publish-plan
        run: |
          repository_tags="$(oras repo tags "$SERVICE_REPOSITORY")" || {
            echo "Failed to list tags for ${SERVICE_REPOSITORY}" >&2
            exit 1
          }

          tag_exists() {
            grep -Fxq -- "$1" <<< "$repository_tags"
          }

          release_exists=false
          contract_exists=false
          if tag_exists "$RELEASE_SERVICE_TAG" && tag_exists "$SERVICE_CONTRACT_TAG"; then
            echo "Service version ${SERVICE_VERSION} is already published; skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if tag_exists "$RELEASE_SERVICE_TAG"; then
            release_exists=true
          fi

          if tag_exists "$SERVICE_CONTRACT_TAG"; then
            contract_exists=true
          fi

          if [[ "$release_exists" != "$contract_exists" ]]; then
            echo "Inconsistent published state for service version ${SERVICE_VERSION}" >&2
            echo "Release image tag exists: ${release_exists}" >&2
            echo "Service contract tag exists: ${contract_exists}" >&2
            echo "Expected both tags to exist or both to be absent:" >&2
            echo "  ${SERVICE_REPOSITORY}:${RELEASE_SERVICE_TAG}" >&2
            echo "  ${SERVICE_REPOSITORY}:${SERVICE_CONTRACT_TAG}" >&2
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.publish-plan.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install Syft
        if: steps.publish-plan.outputs.should_publish == 'true'
        run: |
          curl -fsSLo syft.tar.gz https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_arm64.tar.gz
          tar -xzf syft.tar.gz syft
          sudo install -m 0755 syft /usr/local/bin/syft

      - name: Install image inspection tool
        if: steps.publish-plan.outputs.should_publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Configure Rust service notices
        if: steps.publish-plan.outputs.should_publish == 'true'
        id: rust-service
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [[ -f "services/$SERVICE/Cargo.toml" ]]; then
            source .github/scripts/rust-notices/toolchain.env
            echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust for notice collection
        if: steps.rust-service.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rust-docs

      - name: Generate Rust notices and SBOM
        if: steps.rust-service.outputs.enabled == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          source .github/scripts/rust-notices/toolchain.env
          cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli
          notice_args="$(uv run --no-project python .github/scripts/rust-notices/review.py "services/$SERVICE/Cargo.toml" --cargo-args)"
          mapfile -t notice_args <<< "$notice_args"
          bash .github/scripts/rust-notices/generate.sh "services/$SERVICE/notices/rust" "${notice_args[@]}"
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo cyclonedx "${notice_args[@]}" --format json --spec-version 1.5 \
            --no-build-deps --override-filename rust
          mv "services/$SERVICE/rust.json" "$RUNNER_TEMP/rust-sbom.json"
          echo "RUST_SBOM=$RUNNER_TEMP/rust-sbom.json" >> "$GITHUB_ENV"

      - name: Set up Go for probe notice collection
        if: steps.publish-plan.outputs.should_publish == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache: false

      - name: Generate probe dependency notices
        if: steps.publish-plan.outputs.should_publish == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          bash .github/scripts/probe-notices/generate.sh "$SERVICE"

      - name: Export service image with provenance
        if: steps.publish-plan.outputs.should_publish == 'true'
        working-directory: services
        env:
          SERVICE: ${{ matrix.service }}
          RUST_SERVICE: ${{ steps.rust-service.outputs.enabled }}
        run: |
          target="${SERVICE}-service"
          metadata="$RUNNER_TEMP/build-metadata-${SERVICE}.json"
          image_layout="$RUNNER_TEMP/service-image-${SERVICE}"
          rust_build_args=()
          if [[ "$RUST_SERVICE" == true ]]; then
            rust_build_args+=(--set "${target}.args.EXPECTED_RUST_VERSION=${RUSTUP_TOOLCHAIN}")
          fi

          docker buildx bake \
            "${rust_build_args[@]}" \
            --file compose.yaml \
            --metadata-file "$metadata" \
            --set "${target}.tags=" \
            --set "${target}.output=type=oci,name=${SERVICE_REPOSITORY},dest=${image_layout},tar=false" \
            --sbom=false \
            --provenance=mode=min \
            "$target"

          image_digest="$(jq -er --arg target "$target" '.[$target]["containerimage.digest"]' "$metadata")"
          echo "IMAGE_DIGEST=${image_digest}" >> "$GITHUB_ENV"
          echo "IMAGE_LAYOUT=${image_layout}" >> "$GITHUB_ENV"

      - name: Validate image licenses and notices
        if: steps.publish-plan.outputs.should_publish == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          RUST_SERVICE: ${{ steps.rust-service.outputs.enabled }}
        run: |
          image="cairn-license-check:${SERVICE}"
          skopeo copy --override-os linux --override-arch arm64 \
            "oci:${IMAGE_LAYOUT}" "docker-daemon:${image}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$image")" = "Apache-2.0"
          container="$(docker create "$image")"
          trap 'docker rm "$container" >/dev/null' EXIT
          license="$RUNNER_TEMP/image-license-${SERVICE}"
          docker cp "$container:/usr/share/licenses/cairn/LICENSE" "$license"
          cmp LICENSE "$license"
          disclaimer="$RUNNER_TEMP/image-disclaimer-${SERVICE}"
          docker cp "$container:/THIRD-PARTY-DISCLAIMER.txt" "$disclaimer"
          cmp THIRD-PARTY-DISCLAIMER.txt "$disclaimer"
          if [[ "$RUST_SERVICE" == true ]]; then
            uv run --no-project python .github/scripts/rust-notices/review.py "services/$SERVICE/Cargo.toml" --check
            notices="$RUNNER_TEMP/rust-notices-${SERVICE}"
            docker cp "$container:/usr/share/licenses/cairn/rust" "$notices"
            diff --recursive "services/$SERVICE/notices/rust" "$notices"
          fi
          probe_notices="$RUNNER_TEMP/probe-notices-${SERVICE}"
          docker cp "$container:/usr/share/licenses/cairn/grpc-health-probe" "$probe_notices"
          diff --recursive "services/$SERVICE/notices/grpc-health-probe" "$probe_notices"

      - name: Validate installed package notices
        if: steps.publish-plan.outputs.should_publish == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image="cairn-license-check:${SERVICE}"
          checks="type=bind,src=$PWD/.github/scripts/container-notices,dst=/checks,readonly"
          docker run --rm --entrypoint sh --mount "$checks" "$image" /checks/check-package-notices.sh

      - name: Prepare SBOMs before upload
        if: steps.publish-plan.outputs.should_publish == 'true'
        run: |
          rust_sbom_args=()
          if [[ -n "${RUST_SBOM:-}" ]]; then
            rust_sbom_args=(--rust-sbom "$RUST_SBOM")
          fi
          uv run --no-project python .github/scripts/sbom/generate.py \
            "$IMAGE_LAYOUT" "$IMAGE_DIGEST" \
            lib/crates/cairn/SBOM-DISCLAIMER.txt "${rust_sbom_args[@]}"

      - name: Prepare dependency source links
        if: steps.publish-plan.outputs.should_publish == 'true' && matrix.service != 'messaging'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          source_file="$RUNNER_TEMP/${SERVICE}-dependency-sources-${IMAGE_DIGEST#sha256:}.md"
          supplement_args=()
          source_hook="services/${SERVICE}/scripts/source_links.py"
          if [[ -f "$source_hook" ]]; then
            supplement="$RUNNER_TEMP/${SERVICE}-source-supplement.json"
            uv run --no-project python "$source_hook" \
              --image "cairn-license-check:${SERVICE}" --output "$supplement"
            supplement_args=(--supplement "$supplement")
          fi
          # Use the service's base image and repository setup, before any service build steps.
          docker build --target package-repositories \
            --tag "cairn-source-repositories:${SERVICE}" "services/${SERVICE}"
          bash .github/scripts/sbom/prepare_source_links.sh \
            "cairn-source-repositories:${SERVICE}" \
            --image "${SERVICE_REPOSITORY}@${IMAGE_DIGEST}" \
            "${supplement_args[@]}" \
            --output "$source_file" "$IMAGE_LAYOUT"/sbom-*.spdx.json
          (
            cd "$RUNNER_TEMP"
            oras attach --oci-layout \
              --artifact-type application/vnd.cairn.dependency-sources \
              "${IMAGE_LAYOUT}@${IMAGE_DIGEST}" "${source_file##*/}:text/markdown"
          )

      - name: Publish prepared image, SBOMs, and source links
        if: steps.publish-plan.outputs.should_publish == 'true'
        run: |
          oras cp --recursive --from-oci-layout \
            "${IMAGE_LAYOUT}@${IMAGE_DIGEST}" \
            "${SERVICE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Package service contract
        if: steps.publish-plan.outputs.should_publish == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          uv run --with PyYAML==6.0.2 python .github/scripts/cairn-contract/package-service-contract.py \
              "$SERVICE" \
              "$RUNNER_TEMP/cairn-contract-${SERVICE}.tar"

      - name: Publish and verify service contract
        if: steps.publish-plan.outputs.should_publish == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image_subject="${SERVICE_REPOSITORY}@${IMAGE_DIGEST}"
          contract_artifact_type="application/vnd.cairn.service-contract"
          contract_layer_type="application/vnd.cairn.service-contract.layer+tar"
          contract_layer="cairn-contract-${SERVICE}.tar:${contract_layer_type}"

          contract_digest="$(
            cd "$RUNNER_TEMP"
            oras attach \
              --artifact-type "$contract_artifact_type" \
              --format go-template \
              --template '{{.digest}}' \
              --annotation "com.arm.cairn.service=${SERVICE}" \
              --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.version=${SERVICE_VERSION}" \
              "$image_subject" \
              "$contract_layer"
          )"
          discover_output="$(
            oras discover \
              --artifact-type "$contract_artifact_type" \
              "$image_subject"
          )"
          echo "$discover_output"
          if ! grep -Fq "$contract_digest" <<< "$discover_output"; then
            echo "Contract ${contract_digest} was not discoverable from ${image_subject}" >&2
            exit 1
          fi

          retrieved_contract_dir="$(mktemp -d)"
          oras pull \
            --output "$retrieved_contract_dir" \
            "${SERVICE_REPOSITORY}@${contract_digest}"
          cmp \
            "$RUNNER_TEMP/cairn-contract-${SERVICE}.tar" \
            "$retrieved_contract_dir/cairn-contract-${SERVICE}.tar"

          oras tag "${SERVICE_REPOSITORY}@${contract_digest}" "$SERVICE_CONTRACT_TAG"
          echo "Published ${SERVICE_REPOSITORY}:${SERVICE_CONTRACT_TAG} as ${contract_digest}"

      - name: Publish release service image tag
        if: steps.publish-plan.outputs.should_publish == 'true'
        run: |
          docker buildx imagetools create \
            --tag "$RELEASE_SERVICE_IMAGE" \
            "${SERVICE_REPOSITORY}@${IMAGE_DIGEST}"
          echo "Published ${RELEASE_SERVICE_IMAGE} as ${IMAGE_DIGEST}"

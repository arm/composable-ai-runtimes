$schema: https://json-schema.org/draft/2020-12/schema
title: Cairn bundle configuration

type: object
required: [version, components]
additionalProperties: false

properties:
  version:
    $ref: '#/$defs/version'
  notes:
    type: string
  components:
    type: object
    minProperties: 1
    propertyNames:
      enum: [rust, python, camera, messaging, perception]
    additionalProperties:
      $ref: '#/$defs/version'

$defs:
  version:
    type: string
    pattern: '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$'
    not:
      pattern: '\s'

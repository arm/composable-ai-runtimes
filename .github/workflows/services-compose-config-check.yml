name: Services Compose Config Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - services/compose.yaml
      - .github/workflows/services-compose-config-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate services Compose config
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate services Compose config
        run: docker compose -f services/compose.yaml config

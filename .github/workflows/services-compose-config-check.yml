name: Services Compose Config Check

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    if: vars.INTERNAL_REPO == 'true'
    uses: ./.github/workflows/ci-detect-changes.yml
    permissions:
      contents: read
    with:
      paths: |
        .python-version
        .github/scripts/cairn-contract/validate-manifests.py
        services/compose.yaml
        services/*/compose.yaml
        docs/spec/schema/compose.cairn.schema.yaml
        .github/workflows/services-compose-config-check.yml
        .github/workflows/ci-detect-changes.yml
        .github/workflows/ci-evaluate-results.yml

  compose-config:
    needs: changes
    if: vars.INTERNAL_REPO == 'true' && needs.changes.outputs.changed == 'true'
    name: Validate services Compose config
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          version: "0.13.5"
          checksum: "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"

      - name: Validate services Compose config
        run: docker compose -f services/compose.yaml config

      - name: Validate Cairn service metadata
        run: |
          uv pip install PyYAML==6.0.2 jsonschema==4.25.1
          python .github/scripts/cairn-contract/validate-manifests.py

  required:
    name: CI / Services Compose Config Check
    if: always() && vars.INTERNAL_REPO == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [changes, compose-config]
    uses: ./.github/workflows/ci-evaluate-results.yml
    with:
      results: ${{ toJSON(needs) }}

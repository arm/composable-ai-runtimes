name: Lint

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  prek:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: vars.INTERNAL_REPO == 'true'
    runs-on: self-hosted-ubuntu-24.04-arm64-ephemeral
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            lib -> target
            services/camera -> target
            services/messaging -> target
          save-if: ${{ github.event_name == 'push' }}

      - name: Install native hook dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libpipewire-0.3-dev \
            pkg-config \
            protobuf-compiler \
            python3.12-dev \
            redis-server

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"

      - name: Compare package and service legal files with the root copies
        run: |
          for directory in lib lib/crates/* services/camera services/messaging services/perception; do
            for name in LICENSE THIRD-PARTY-DISCLAIMER.txt; do
              document="$directory/$name"
              if [ -L "$document" ] || [ ! -f "$document" ] || ! cmp -s "$name" "$document"; then
                echo "::error file=$document::Replace $document with a regular copy of the root $name."
                exit 1
              fi
            done
          done

      - name: Log in to Docker Hub
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Run prek pre-push hooks
        uses: j178/prek-action@ee00ace987cbe39678904658577b2993ae0f7f23 # v2 tag
        with:
          prek-version: "0.5.7"
          extra-args: "--all-files --stage pre-push"

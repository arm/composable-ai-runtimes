minimum_prek_version = "0.5.7"
default_install_hook_types = ["pre-push"]
default_stages = ["pre-push"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
types = ["text"]
exclude = '''(?x)^(
  lib/Cargo\.lock|
  lib/python/cairn/.*\.pyi|
  services/camera/Cargo\.lock
)'''

[[repos.hooks]]
id = "end-of-file-fixer"
types = ["text"]
exclude = '''(?x)^(
  lib/Cargo\.lock|
  lib/python/cairn/.*\.pyi|
  services/camera/Cargo\.lock
)'''

[[repos.hooks]]
id = "fix-byte-order-marker"
types = ["text"]

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]
types = ["text"]

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024", "--enforce-all"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "license-headers"
name = "license headers"
language = "system"
entry = "uv run --no-project python .github/scripts/check_license_headers.py"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "python-messaging-proto-current"
name = "Python Messaging protobuf bindings are current"
language = "system"
entry = "bash -c 'protoc --proto_path=services/messaging/proto/cairn/messaging/v1 --python_out=lib/tests/generated services/messaging/proto/cairn/messaging/v1/messaging.proto && protoc --proto_path=services/messaging/proto/cairn/messaging/v1 --python_out=.github/scripts/camera_smoke/generated services/messaging/proto/cairn/messaging/v1/messaging.proto'"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
  { id = "ruff-check", args = [".", "--extend-exclude", "services/perception,.github/scripts/camera_smoke/generated/messaging_pb2.py,lib/tests/generated/messaging_pb2.py"], exclude = "^services/perception/", pass_filenames = false },
]

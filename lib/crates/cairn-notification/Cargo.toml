[package]
name = "arm-cairn-notification"
version.workspace = true
description = "Internal notification service client for Cairn"
edition.workspace = true
license.workspace = true
include = [
  "src/generated/**",
  "src/lib.rs",
  "src/service.rs",
  "README.md",
  "LICENSE",
  "THIRD-PARTY-DISCLAIMER.txt",
]

[lib]
name = "cairn_notification"
path = "src/lib.rs"

[features]
proto-generation = ["dep:prost-build"]

[dependencies]
tonic = { version = "=0.14.5" }
tonic-health = { version = "=0.14.5" }
bytes = { version = "=1.11.1"}
futures-util = { version = "=0.3.32"}
prost = { version = "=0.14.3" }
prost-build = { version = "=0.14.3", optional = true }
prost-types = { version = "=0.14.3" }
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { version = "=0.1.44"}

[dev-dependencies]
redis-test = { version = "=1.0.4"}

[[bin]]
name = "generate-messaging-proto"
path = "src/bin/generate_messaging_proto.rs"
required-features = ["proto-generation"]

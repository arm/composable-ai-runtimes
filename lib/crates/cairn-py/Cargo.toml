[package]
name = "arm-cairn-py"
version.workspace = true
description = "PyO3 bindings for the Cairn library"
edition.workspace = true
license.workspace = true
include = ["src/**", "LICENSE", "THIRD-PARTY-DISCLAIMER.txt"]

[lib]
name = "_bindings"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
cairn = { workspace = true }
chrono = { version = "=0.4.45" }
pyo3 = { version = "=0.29.2", features = ["abi3-py313", "chrono"] }
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
pyo3-stub-gen = { version = "=0.23.0" }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

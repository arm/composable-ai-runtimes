[package]
name = "arm-cairn-perception"
version.workspace = true
description = "Internal perception service client for Cairn"
edition.workspace = true
license.workspace = true
include = ["src/**", "bin/**", "README.md", "LICENSE", "THIRD-PARTY-DISCLAIMER.txt"]

[lib]
name = "cairn_perception"
path = "src/lib.rs"

[[example]]
name = "generate_perception_proto"
path = "bin/generate_perception_proto.rs"

[dependencies]
tonic-health = { version = "=0.14.5" }
tokio = { version = "=1.53.1", features = ["time"] }
cairn-camera = { workspace = true }
open_perception_kit = { workspace = true }
prost = { version = "=0.14.3" }
tonic = { version = "=0.14.5" }
tonic-prost = { version = "=0.14.5" }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
tonic-prost-build = { version = "=0.14.5" }

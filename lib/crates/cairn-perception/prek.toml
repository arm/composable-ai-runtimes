minimum_prek_version = "0.5.7"
default_stages = ["pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "perception-proto-generated"
name = "Perception Rust protobuf bindings are current"
language = "system"
entry = "cargo run --locked --example generate_perception_proto"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[package]
name = "arm-cairn-camera"
version.workspace = true
description = "Internal camera service client for Cairn"
edition.workspace = true
license.workspace = true
include = ["src/**", "bin/**", "README.md", "bom.json", "LICENSE", "SBOM-DISCLAIMER.txt", "THIRD-PARTY-DISCLAIMER.txt"]

[lib]
name = "cairn_camera"
path = "src/lib.rs"

[[example]]
name = "generate_camera_proto"
path = "bin/generate_camera_proto.rs"

[dependencies]
tonic-health = { workspace = true }
tokio = { workspace = true, features = ["time"] }
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true}

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }

tonic-prost-build = { workspace = true }

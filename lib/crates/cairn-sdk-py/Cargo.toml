[package]
name = "cairn-sdk-py"
version = "0.0.1"
description = "PyO3 bindings for the Cairn SDK"
edition = "2024"

[lib]
name = "_bindings"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cairn-sdk = { package = "cairn-sdk-lib", path = "../cairn-sdk" }
numpy = "0.28.0"
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py312", "chrono"] }
pyo3-stub-gen = "0.19.0"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }

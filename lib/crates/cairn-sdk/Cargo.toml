[package]
name = "cairn-sdk-lib"
version = "0.0.1"
description = "Core Rust library for the Cairn SDK"
edition = "2024"

[lib]
name = "cairn_sdk"
path = "src/lib.rs"

[dependencies]
pipewire = "0.9.2"
prost = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

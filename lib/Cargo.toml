[package]
name = "cairn-sdk-lib"
version = "0.0.1"
description = "Core library for the Cairn SDK"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
prost = "0.14"
tonic = "0.14"
# For some reason this is not pulled in by default by tonic
tonic-prost = "0.14"
pipewire = "0.9.2"

[build-dependencies]
tonic-prost-build = "0.14.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


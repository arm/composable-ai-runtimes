minimum_prek_version = "0.5.7"
default_stages = ["pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
pass_filenames = false
files = { glob = ["**/*.rs", "**/Cargo.toml"] }

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets --all-features --no-deps"
pass_filenames = false
files = { glob = ["**/*.rs", "**/Cargo.toml"] }

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
language = "system"
entry = "cargo test --workspace --all-targets"
pass_filenames = false
stages = ["pre-push"]
files = { glob = ["**/*.rs", "**/Cargo.toml"] }

[[repos.hooks]]
id = "python-stubs-current"
name = "Python stubs are current"
language = "system"
entry = "bash -c 'cargo run -p arm-cairn-py --bin stub_gen && git diff --exit-code -- \":(glob)python/cairn/**/*.pyi\"'"
pass_filenames = false
stages = ["pre-push"]
files = { glob = ["**/*.rs", "**/Cargo.toml", "pyproject.toml", "python/cairn/**/*.pyi"] }
